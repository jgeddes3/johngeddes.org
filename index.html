<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/JohnGeddlogo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EAE0D5" />
    <script>
      // Resolve the theme before first paint. ThemeContext does the same thing
      // after React mounts, but by then a dark-mode visitor has already seen a
      // beige flash from the loader and the default :root palette.
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference');
          var hour = new Date().getHours();
          var theme = (stored === 'light' || stored === 'dark') ? stored : ((hour >= 19 || hour < 7) ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#30343F' : '#EAE0D5');
        } catch (e) {}
      })();
    </script>
    <title>John Geddes — AV & Software Engineer in Chicago</title>
    <style>
      @keyframes jg-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>
      <h1>John Geddes — AV & Software Engineer</h1>
      <p>The portfolio of John Geddes, Audio Visual Engineer and Developer.</p>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/projects">Projects</a></li>
          <li><a href="/misc">Misc</a></li>
          <li><a href="/contracts">Contracts</a></li>
          <li><a href="/friends">Friends & Interests</a></li>
          <li><a href="/philosophy">Philosophy</a></li>
        </ul>
      </nav>
    </noscript>
    <div id="root">
      <div id="initial-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;background-color:var(--bg-primary,#EAE0D5);position:fixed;top:0;left:0;z-index:9999;">
        <div style="position:relative;width:80px;height:80px;">
          <img src="/LoadJG1.png" alt="" style="position:absolute;width:100%;height:100%;object-fit:contain;" />
          <img src="/LoadJG2.png" alt="" style="position:absolute;width:100%;height:100%;object-fit:contain;animation:jg-spin 1.5s linear infinite;" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
